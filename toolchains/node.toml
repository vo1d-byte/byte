id = "node"
name = "Node.js"
version = "22.11.0"
# Official builds use glibc, so they run inside the proot rootfs.
runtime = "rootfs"
bin = ["bin"]

[language]
extensions = ["js", "mjs", "cjs", "ts"]
run = "node {file}"
lsp = "typescript-language-server --stdio"
debug = "node --inspect-brk {file}"
comment = "//"

[[artifacts]]
abi = "linux-arm64"
url = "https://nodejs.org/dist/v22.11.0/node-v22.11.0-linux-arm64.tar.gz"
sha256 = "PIN_ME"
format = "tar_gz"
strip_components = 1
