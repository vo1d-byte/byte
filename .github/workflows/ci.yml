# Move this file to .github/workflows/ci.yml (GitHub's web UI or git push with
# a token that has the `workflow` scope; the default Actions token cannot add workflows).
name: CI
on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p byte-core -p byte-term -p byte-toolchain

  android:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - run: cargo install cargo-ndk --locked
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: gradle assembleDebug testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: byte-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
