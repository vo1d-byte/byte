[package]
name = "byte_core"
version = "0.3.0"
edition = "2021"
description = "Native systems core and text editor engine for Byte IDE"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
ropey = "1.6"
jni = "0.21"
tree-sitter = "0.25.10"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-rust = "0.24.2"

tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
serde_json = "1.0"
