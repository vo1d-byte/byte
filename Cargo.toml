[workspace]
resolver = "2"
members = [
    "crates/byte-core",
    "crates/byte-term",
    "crates/byte-toolchain",
    "crates/byte-git",
    "crates/byte-jni",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
